<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Excel Viewer - Ban Nong Saeng School</title>
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- โหลด Google Font Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-[#f8f4f1] dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="p-4 bg-gradient-to-r from-red-500 to-yellow-400 text-white text-center">
    <h1 class="text-2xl font-bold">📊 ระบบดูข้อมูล Excel</h1>
  </header>

  <!-- ส่วนค้นหา -->
  <section class="p-4">
    <input id="searchInput" type="text" placeholder="🔍 ค้นหาข้อมูล..." 
      class="w-full p-2 border rounded focus:outline-none focus:ring focus:border-blue-300">
  </section>

  <!-- ตารางแสดงข้อมูล -->
  <section class="p-4 overflow-x-auto">
    <table id="dataTable" class="min-w-full border-collapse border border-gray-300">
      <thead class="bg-gray-200 dark:bg-gray-700">
        <tr id="tableHeader"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 hidden px-4 py-2 rounded shadow-lg bg-green-500 text-white"></div>

  <!-- ปุ่มสลับ Dark/Light Mode -->
  <button onclick="toggleDarkMode()" 
    class="fixed top-5 right-5 px-3 py-2 bg-gray-800 text-white rounded">🌗</button>

  <!-- Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    // 📌 ฟังก์ชันโหลดไฟล์ Excel จาก OneDrive
    async function loadExcel() {
      try {
        const url = 'https://1drv.ms/x/c/35ce87ae60eae137/IQA34epgrofOIIA1NQEAAAAAAYbdjLpjXVU69CxG6JsrBRo?e=FZ0tM7';
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });

        // 📌 เลือก worksheet 'Sheet1'
        const sheet = workbook.Sheets['Sheet1'];
        const jsonData = XLSX.utils.sheet_to_json(sheet);

        renderTable(jsonData);
        showToast("✅ โหลดข้อมูลสำเร็จ");
      } catch (error) {
        showToast("❌ เกิดข้อผิดพลาดในการโหลดไฟล์");
        console.error(error);
      }
    }

    // 📌 ฟังก์ชันแสดงข้อมูลในตาราง
    function renderTable(data) {
      const headerRow = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');
      headerRow.innerHTML = '';
      body.innerHTML = '';

      if (data.length === 0) return;

      // สร้างหัวตาราง
      Object.keys(data[0]).forEach(key => {
        const th = document.createElement('th');
        th.textContent = key;
        th.className = "border px-4 py-2 cursor-pointer hover:bg-yellow-200";
        th.onclick = () => sortTable(key, data);
        headerRow.appendChild(th);
      });

      // สร้างแถวข้อมูล
      data.forEach(row => {
        const tr = document.createElement('tr');
        Object.values(row).forEach(val => {
          const td = document.createElement('td');
          td.textContent = val;
          td.className = "border px-4 py-2";
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });

      // ฟังก์ชันค้นหา
      document.getElementById('searchInput').addEventListener('input', e => {
        const keyword = e.target.value.toLowerCase();
        const filtered = data.filter(row => 
          Object.values(row).some(val => String(val).toLowerCase().includes(keyword))
        );
        renderTable(filtered);
      });
    }

    // 📌 ฟังก์ชันเรียงข้อมูล
    function sortTable(key, data) {
      const sorted = [...data].sort((a, b) => (a[key] > b[key] ? 1 : -1));
      renderTable(sorted);
    }

    // 📌 Toast Notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    // 📌 Toggle Dark/Light Mode
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    // 📌 เริ่มโหลดข้อมูลเมื่อเปิดหน้า
    loadExcel();
  </script>
</body>
</html>
