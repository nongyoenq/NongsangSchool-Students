<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Excel Viewer - Modern Sidebar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    /* กำหนด gradient โทนเขียวอ่อน -> เขียวเข้ม สำหรับ header และ sidebar */
    :root{
      --grad-start: #185C37; /* เขียวอ่อน */
      --grad-mid: #10793F;   /* เขียวกลาง */
      --grad-end: #21A366;   /* เขียวเข้ม */
	  --grad-end: #33C481;
    }
    .header-gradient {
      background: linear-gradient(90deg, var(--grad-start), var(--grad-mid), var(--grad-end));
    }
    .sidebar-gradient {
      background: linear-gradient(180deg, var(--grad-start), var(--grad-mid), var(--grad-end));
    }
    /* transition สำหรับการยุบ/ขยาย sidebar */
    .sidebar-transition { transition: width .25s ease, min-width .25s ease; }
    /* ซ่อน label เมื่อ sidebar ยุบ */
    .sidebar-collapsed .menu-label { display: none; }
    .sidebar-collapsed .menu-icon { margin-right: 0; }
    /* ปรับขนาดไอคอนเมื่อยุบ */
    .sidebar-collapsed .menu-icon i { font-size: 1.15rem; }
    /* ปรับความกว้างเมื่อยุบ */
    .sidebar-collapsed { width: 72px !important; min-width: 72px !important; }
    /* ปรับ table header sticky */
    thead th { position: sticky; top: 0; z-index: 10; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar-gradient text-white w-64 min-w-[16rem] sidebar-transition flex flex-col shadow-lg">
      <!-- Sidebar header with collapse button -->
      <div class="flex items-center justify-between px-4 py-4 border-b border-white/20">
        <div class="flex items-center gap-3">
          <div class="bg-white/20 rounded-md p-2">
            <i class="fa-solid fa-file-excel fa-lg"></i>
          </div>
          <div class="text-lg font-semibold menu-label">เมนูไฟล์</div>
        </div>
        <!-- ปุ่มยุบ/ขยาย -->
        <button id="btnToggleSidebar" class="bg-white/20 hover:bg-white/30 p-2 rounded-md">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>

      <!-- Sidebar content -->
      <nav class="flex-1 px-3 py-4 space-y-2">
        <!-- ปุ่มเปิดไฟล์ local (data.xlsx) -->
        <button onclick="loadExcel()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 transition">
          <span class="menu-icon text-xl"><i class="fa-solid fa-folder-open"></i></span>
          <span class="menu-label">เปิดไฟล์ (data.xlsx)</span>
        </button>

        <!-- ปุ่มอัปโหลดไฟล์จากเครื่องผู้ใช้ -->
        <label for="fileInput" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 transition cursor-pointer">
          <span class="menu-icon text-xl"><i class="fa-solid fa-upload"></i></span>
          <span class="menu-label">อัปโหลดไฟล์</span>
        </label>
        <input id="fileInput" type="file" accept=".xlsx,.xls" class="hidden" />

        <!-- Export CSV -->
        <button id="btnExport" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 transition">
          <span class="menu-icon text-xl"><i class="fa-solid fa-file-csv"></i></span>
          <span class="menu-label">Export CSV</span>
        </button>

        <!-- Settings -->
        <button class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 transition">
          <span class="menu-icon text-xl"><i class="fa-solid fa-gear"></i></span>
          <span class="menu-label">ตั้งค่า</span>
        </button>
      </nav>

      <!-- Footer -->
      <div class="px-4 py-3 border-t border-white/20 text-sm flex items-center gap-3">
        <span class="menu-icon text-lg"><i class="fa-solid fa-school"></i></span>
        <span class="menu-label">Ban Nong Saeng School</span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="header-gradient text-white p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button id="btnSidebarMobile" class="md:hidden bg-white/20 p-2 rounded-md">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="text-2xl font-semibold flex items-center gap-3">
            <i class="fa-solid fa-chart-column"></i>
            <span>ระบบดูข้อมูล นักเรียน DMC ปีการศึกษา 2568 - โรงเรียนบ้านหนองแสง</span>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Dark/Light toggle -->
          <button id="btnTheme" class="bg-white/20 hover:bg-white/30 p-2 rounded-md">
            <i class="fa-solid fa-circle-half-stroke"></i>
          </button>
          <!-- User -->
          <div class="bg-white text-green-800 px-3 py-1 rounded-full shadow-sm hidden sm:flex items-center gap-2">
            <i class="fa-solid fa-user"></i>
            <span class="text-sm">ผู้ใช้</span>
          </div>
        </div>
      </header>

      <!-- Controls -->
      <section class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="col-span-2">
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
              <input id="searchInput" type="text" placeholder="ค้นหาข้อมูล..." class="w-full pl-10 p-3 rounded-lg border focus:ring-2 focus:ring-green-400" />
            </div>
          </div>
          <div class="flex items-center gap-3 justify-end">
            <button id="btnReload" onclick="loadExcel()" class="px-4 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700 transition">
              <i class="fa-solid fa-rotate"></i> โหลดใหม่
            </button>
            <button id="btnClear" class="px-4 py-2 bg-white border rounded-lg shadow hover:bg-gray-50 transition">
              ล้าง
            </button>
          </div>
        </div>
      </section>

      <!-- Table area -->
      <section class="p-6 flex-1 overflow-auto">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4">
          <div class="overflow-x-auto">
            <table id="dataTable" class="min-w-full table-auto">
              <thead id="tableHeader" class="bg-green-100 dark:bg-gray-700"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 hidden px-4 py-2 rounded-lg shadow-lg bg-green-600 text-white"></div>

  <!-- XLSX.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    // ===========================
    //  คอมเมนต์ภาษาไทยอธิบายโค้ด
    //  - รองรับการโหลดไฟล์ local (data.xlsx)
    //  - รองรับการอัปโหลดไฟล์จากเครื่องผู้ใช้ (file input)
    //  - Sidebar ยุบ/ขยายได้ทั้ง desktop และ mobile
    // ===========================

    const sidebar = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');
    const btnSidebarMobile = document.getElementById('btnSidebarMobile');
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const tableHeader = document.getElementById('tableHeader');
    const tableBody = document.getElementById('tableBody');
    const toast = document.getElementById('toast');
    let currentData = []; // เก็บข้อมูล JSON ปัจจุบันสำหรับการค้นหา/เรียง

    // ---------- Sidebar ยุบ/ขยาย (desktop) ----------
    btnToggleSidebar.addEventListener('click', () => {
      const collapsed = sidebar.classList.toggle('sidebar-collapsed');
      // เปลี่ยน icon ลูกศร
      const icon = btnToggleSidebar.querySelector('i');
      icon.classList.toggle('fa-chevron-left', !collapsed);
      icon.classList.toggle('fa-chevron-right', collapsed);
    });

    // ---------- Sidebar toggle สำหรับ mobile ----------
    btnSidebarMobile.addEventListener('click', () => {
      // บน mobile ให้ toggle class hidden
      sidebar.classList.toggle('hidden');
    });

    // ---------- Theme toggle (dark/light) ----------
    document.getElementById('btnTheme').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      showToast('เปลี่ยนโหมดสำเร็จ');
    });

    // ---------- โหลดไฟล์ Excel จาก local data.xlsx ----------
    async function loadExcelFromUrl(urlArrayBuffer) {
      try {
        const workbook = XLSX.read(urlArrayBuffer, { type: 'array' });
        const sheet = workbook.Sheets['Sheet1'] || workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        currentData = jsonData;
        renderTable(jsonData);
        showToast('✅ โหลดข้อมูลสำเร็จ');
      } catch (err) {
        console.error(err);
        showToast('❌ เกิดข้อผิดพลาดในการอ่านไฟล์');
      }
    }

    // โหลดไฟล์ data.xlsx ในโฟลเดอร์เดียวกัน
    async function loadExcel() {
      try {
        const resp = await fetch('./data.xlsx');
        if (!resp.ok) throw new Error('ไม่สามารถดาวน์โหลดไฟล์ data.xlsx ได้');
        const arrayBuffer = await resp.arrayBuffer();
        await loadExcelFromUrl(arrayBuffer);
      } catch (err) {
        console.error(err);
        showToast('❌ โหลดไฟล์ local ล้มเหลว (ตรวจสอบ data.xlsx และ server)');
      }
    }

    // ---------- อัปโหลดไฟล์จากเครื่องผู้ใช้ ----------
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const arrayBuffer = await file.arrayBuffer();
        await loadExcelFromUrl(arrayBuffer);
      } catch (err) {
        console.error(err);
        showToast('❌ อ่านไฟล์ที่อัปโหลดล้มเหลว');
      }
    });

    // ---------- แสดงตาราง (render) ----------
    function renderTable(data) {
      tableHeader.innerHTML = '';
      tableBody.innerHTML = '';

      if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td class="p-4 text-center text-gray-500" colspan="20">ไม่มีข้อมูล</td></tr>';
        return;
      }

      // สร้างหัวตารางจากคีย์ของ object แถวแรก
      const keys = Object.keys(data[0]);
      const trHead = document.createElement('tr');
      keys.forEach(key => {
        const th = document.createElement('th');
        th.textContent = key;
        th.className = 'px-4 py-3 text-left text-sm font-medium';
        // คลิกหัวตารางเพื่อเรียงข้อมูล
        th.style.cursor = 'pointer';
        th.addEventListener('click', () => {
          sortTableByKey(key);
        });
        trHead.appendChild(th);
      });
      tableHeader.appendChild(trHead);

      // สร้างแถวข้อมูล
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-green-50 dark:hover:bg-gray-700 transition';
        keys.forEach(k => {
          const td = document.createElement('td');
          td.textContent = row[k];
          td.className = 'px-4 py-2 border-b text-sm';
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      });
    }

    // ---------- ค้นหา (filter) ----------
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderTable(currentData);
        return;
      }
      const filtered = currentData.filter(row =>
        Object.values(row).some(v => String(v).toLowerCase().includes(q))
      );
      renderTable(filtered);
    });

    // ---------- เรียงข้อมูล (sort) ----------
    let lastSort = { key: null, asc: true };
    function sortTableByKey(key) {
      const data = [...currentData];
      // ตรวจสอบชนิดข้อมูลเพื่อเรียงตัวเลขก่อน (พยายามแปลงเป็น number)
      data.sort((a, b) => {
        const va = a[key];
        const vb = b[key];
        const na = parseFloat(va);
        const nb = parseFloat(vb);
        if (!isNaN(na) && !isNaN(nb)) {
          return lastSort.key === key && lastSort.asc ? nb - na : na - nb;
        }
        // string compare
        if (String(va).toLowerCase() < String(vb).toLowerCase()) return lastSort.key === key && lastSort.asc ? 1 : -1;
        if (String(va).toLowerCase() > String(vb).toLowerCase()) return lastSort.key === key && lastSort.asc ? -1 : 1;
        return 0;
      });
      // toggle sort direction
      if (lastSort.key === key) lastSort.asc = !lastSort.asc;
      else { lastSort.key = key; lastSort.asc = true; }
      renderTable(data);
    }

    // ---------- Export CSV (simple) ----------
    document.getElementById('btnExport').addEventListener('click', () => {
      if (!currentData || currentData.length === 0) {
        showToast('ไม่มีข้อมูลให้ Export');
        return;
      }
      // สร้าง CSV จาก currentData
      const keys = Object.keys(currentData[0]);
      const rows = [keys.join(',')];
      currentData.forEach(r => {
        const line = keys.map(k => {
          const cell = String(r[k] ?? '').replace(/"/g, '""');
          return `"${cell}"`;
        }).join(',');
        rows.push(line);
      });
      const csv = rows.join('\n');
      // ดาวน์โหลดไฟล์ CSV
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'export.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('✅ Export CSV สำเร็จ');
    });

    // ---------- Toast notification ----------
    let toastTimer = null;
    function showToast(msg, ms = 3000) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('opacity-100');
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, ms);
    }

    // ---------- ปุ่มล้าง ----------
    document.getElementById('btnClear').addEventListener('click', () => {
      searchInput.value = '';
      renderTable(currentData);
      showToast('ล้างตัวกรองแล้ว');
    });

    // ---------- เริ่มต้น: โหลดไฟล์ data.xlsx (ถ้ามี) ----------
    // เรียกเมื่อหน้าโหลดเสร็จ
    window.addEventListener('load', () => {
      loadExcel();
    });

    // ---------- Responsive: ซ่อน sidebar บน mobile เริ่มต้น ----------
    // (ถ้าต้องการให้ซ่อนโดย default บนหน้าจอเล็ก ให้ uncomment ข้างล่าง)
    // if (window.innerWidth < 768) sidebar.classList.add('hidden');

  </script>
</body>
</html>
